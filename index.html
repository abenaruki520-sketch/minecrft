<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minecraft Style Dodge</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 360px;
            height: 600px;
            background-color: #1e1e1e;
            border: 3px solid #55ff55;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(85, 255, 85, 0.3);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #111;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #55ff55;
            margin-bottom: 10px;
            font-size: 24px;
            text-shadow: 0 0 8px #55ff55;
        }
        p {
            color: #dddddd;
            margin-bottom: 15px;
            font-size: 13px;
            line-height: 1.6;
        }
        .rule-box {
            text-align: left;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #aaffaa;
            line-height: 1.5;
        }
        button {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            color: #000000;
            background-color: #55ff55;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 10px #55ff55;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="360" height="600"></canvas>

    <!-- スタート画面 -->
    <div id="start-screen" class="overlay">
        <h1>CRAFT DODGE</h1>
        <div class="rule-box">
            ・👤 プレイヤー：スティーブ<br>
            ・👾 障害物：クリーパー（速度遅め）<br>
            ・✨ 100pt毎にガード1回（最大3回）<br>
            ・🟢 経験値オーブ連取（1秒以内）で+10コンボ！
        </div>
        <p>【操作】<br>PC: ◀ / ▶ キー<br>スマホ: 画面の左右をタップ</p>
        <button onclick="startGame()">ゲームスタート</button>
    </div>

    <!-- ゲームオーバー画面 -->
    <div id="gameover-screen" class="overlay" style="display: none;">
        <h1 style="color: #ff4444; text-shadow: 0 0 8px #ff4444;">GAME OVER</h1>
        <p id="score-text" style="font-size: 18px; font-weight: bold;">SCORE: 0</p>
        <button onclick="startGame()">もう一度プレイ</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ゲーム状態
let gameState = 'START';
let score = 0;
let frameCount = 0;
let lastGuardScore = 0;
let guardCount = 0;
const MAX_GUARD = 3;
let invincibleTimer = 0;
let lastOrbTime = 0;

// プレイヤー（スティーブ）
const player = {
    x: 160,
    y: 510,
    width: 36,
    height: 48,
    speed: 6
};

// 障害物・オーブ・テキストポップアップ
let obstacles = [];
let expOrbs = [];
let popups = [];

// キー入力状態
const keys = { left: false, right: false };

window.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
});
window.addEventListener('keyup', function(e) {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

canvas.addEventListener('touchstart', handleTouch);
canvas.addEventListener('touchend', function() {
    keys.left = false;
    keys.right = false;
});

function handleTouch(e) {
    e.preventDefault();
    const touchX = e.touches[0].clientX;
    const rect = canvas.getBoundingClientRect();
    const canvasTouchX = touchX - rect.left;

    if (canvasTouchX < rect.width / 2) {
        keys.left = true;
        keys.right = false;
    } else {
        keys.left = false;
        keys.right = true;
    }
}

function startGame() {
    score = 0;
    frameCount = 0;
    lastGuardScore = 0;
    guardCount = 0;
    invincibleTimer = 0;
    lastOrbTime = 0;
    player.x = canvas.width / 2 - player.width / 2;
    obstacles = [];
    expOrbs = [];
    popups = [];
    gameState = 'PLAYING';

    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('gameover-screen').style.display = 'none';
}

function gameOver() {
    gameState = 'GAMEOVER';
    document.getElementById('score-text').innerText = 'SCORE: ' + Math.floor(score);
    document.getElementById('gameover-screen').style.display = 'flex';
}

function addPopup(text, x, y, color) {
    popups.push({ text: text, x: x, y: y, opacity: 1.0, color: color || '#55ff55' });
}

function isColliding(a, b) {
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
}

// ----------------------------------------------------
// 描画関数群（スティーブ、クリーパー、経験値オーブ）
// ----------------------------------------------------

// スティーブ（自機）の描画
function drawSteve(x, y, w, h) {
    [不審なリンクを削除しました]();
    if (invincibleTimer > 0 && Math.floor(frameCount / 4) % 2 === 0) {
        ctx.globalAlpha = 0.4;
    }

    const bw = w / 8;
    const bh = h / 12;

    // 髪の毛
    ctx.fillStyle = '#4a2e12';
    ctx.fillRect(x, y, w, bh * 3);

    // 顔・肌
    ctx.fillStyle = '#c68b59';
    ctx.fillRect(x, y + bh * 3, w, bh * 4);

    // 目
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x + bw, y + bh * 4, bw * 2, bh);
    ctx.fillRect(x + bw * 5, y + bh * 4, bw * 2, bh);
    ctx.fillStyle = '#2c2073';
    ctx.fillRect(x + bw * 2, y + bh * 4, bw, bh);
    ctx.fillRect(x + bw * 5, y + bh * 4, bw, bh);

    // 口・鼻
    ctx.fillStyle = '#4a2e12';
    ctx.fillRect(x + bw * 3, y + bh * 5.5, bw * 2, bh);

    // 水色の服
    ctx.fillStyle = '#00a2ac';
    ctx.fillRect(x, y + bh * 7, w, bh * 3);

    // 青のズボン
    ctx.fillStyle = '#2c3b8e';
    ctx.fillRect(x + bw, y + bh * 10, bw * 6, bh * 2);

    // ガードバリアの表示
    if (guardCount > 0) {
        ctx.strokeStyle = '#55ff55';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h / 2, w * 0.75, 0, Math.PI * 2);
        ctx.stroke();
    }

    ctx.restore();
}

// クリーパー（障害物）の描画
function drawCreeper(x, y, w, h) {
    [不審なリンクを削除しました]();
    // 緑の頭部
    ctx.fillStyle = '#38b000';
    ctx.fillRect(x, y, w, h);

    // 顔のパーツ
    ctx.fillStyle = '#000000';
    const bw = w / 8;
    const bh = h / 8;

    // 目
    ctx.fillRect(x + bw * 1.5, y + bh * 1.5, bw * 2, bh * 2);
    ctx.fillRect(x + bw * 4.5, y + bh * 1.5, bw * 2, bh * 2);
    // 鼻・口
    ctx.fillRect(x + bw * 3, y + bh * 3.5, bw * 2, bh * 2.5);
    ctx.fillRect(x + bw * 2, y + bh * 5, bw, bh * 2.5);
    ctx.fillRect(x + bw * 5, y + bh * 5, bw, bh * 2.5);

    ctx.restore();
}

// 経験値オーブ（スコア玉）の描画
function drawExpOrb(x, y, size) {
    [不審なリンクを削除しました]();
    const half = size / 2;
    const pulse = Math.sin(frameCount * 0.15) * 2;

    ctx.fillStyle = (Math.floor(frameCount / 8) % 2 === 0) ? '#70e000' : '#ccff00';

    ctx.beginPath();
    ctx.moveTo(x + half, y - pulse);
    ctx.lineTo(x + size + pulse, y + half);
    ctx.lineTo(x + half, y + size + pulse);
    ctx.lineTo(x - pulse, y + half);
    ctx.closePath();
    ctx.fill();

    // 中央の光
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x + half - 2, y + half - 2, 4, 4);

    ctx.restore();
}

// ----------------------------------------------------
// ゲームループ処理
// ----------------------------------------------------

function update() {
    if (gameState !== 'PLAYING') return;

    frameCount++;
    score += 0.2; // 距離スコア

    if (invincibleTimer > 0) invincibleTimer--;

    // スコア100ごとに1回ガード獲得（最大3回まで）
    if (score - lastGuardScore >= 100) {
        lastGuardScore = Math.floor(score / 100) * 100;
        if (guardCount < MAX_GUARD) {
            guardCount++;
            addPopup('GUARD +1!', player.x, player.y - 20, '#55ff55');
        }
    }

    // プレイヤーの移動
    if (keys.left && player.x > 0) {
        player.x -= player.speed;
    }
    if (keys.right && player.x < canvas.width - player.width) {
        player.x += player.speed;
    }

    // クリーパー（障害物）の生成（ゆっくりめのスピード：2.0〜2.8）
    if (frameCount % 55 === 0) {
        obstacles.push({
            x: Math.random() * (canvas.width - 36),
            y: -40,
            width: 36,
            height: 36,
            speed: 2.0 + Math.random() * 0.8
        });
    }

    // 経験値オーブ（スコア玉）の生成
    if (frameCount % 90 === 0) {
        expOrbs.push({
            x: Math.random() * (canvas.width - 24),
            y: -24,
            width: 20,
            height: 20,
            speed: 2.5
        });
    }

    // クリーパーの移動・当たり判定
    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += obs.speed;

        if (isColliding(player, obs)) {
            if (invincibleTimer > 0) {
                // 無敵時間中はスルー
            } else if (guardCount > 0) {
                // ガード消費でクラッシュ回避
                guardCount--;
                invincibleTimer = 90; // 約1.5秒間の無敵時間
                obstacles.splice(i, 1);
                addPopup('GUARDED!', player.x, player.y - 20, '#ffff00');
                continue;
            } else {
                gameOver();
                return;
            }
        }

        if (obs.y > canvas.height) {
            obstacles.splice(i, 1);
        }
    }

    // 経験値オーブの移動・取得判定（コンボシステム）
    for (let i = expOrbs.length - 1; i >= 0; i--) {
        let orb = expOrbs[i];
        orb.y += orb.speed;

        if (isColliding(player, orb)) {
            const now = [不審なリンクを削除しました]();
            let addedScore = 50;

            // 1秒以内（1000ms以内）に連続取得した場合はコンボ発生！
            if (lastOrbTime > 0 && (now - lastOrbTime) <= 1000) {
                addedScore += 10;
                addPopup('COMBO! +10', orb.x, orb.y, '#ffaa00');
            } else {
                addPopup('+50', orb.x, orb.y, '#55ff55');
            }

            score += addedScore;
            lastOrbTime = now;
            expOrbs.splice(i, 1);
            continue;
        }

        if (orb.y > canvas.height) {
            expOrbs.splice(i, 1);
        }
    }

    // ポップアップテキスト更新
    for (let i = popups.length - 1; i >= 0; i--) {
        let p = popups[i];
        p.y -= 1;
        p.opacity -= 0.02;
        if (p.opacity <= 0) popups.splice(i, 1);
    }
}

function draw() {
    ctx.fillStyle = '#1e1e1e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'PLAYING') {
        // クリーパー（障害物）描画
        obstacles.forEach(function(obs) {
            drawCreeper(obs.x, obs.y, obs.width, obs.height);
        });

        // 経験値オーブ描画
        expOrbs.forEach(function(orb) {
            drawExpOrb(orb.x, orb.y, orb.width);
        });

        // スティーブ（プレイヤー）描画
        drawSteve(player.x, player.y, player.width, player.height);

        // ポップアップテキスト描画
        popups.forEach(function(p) {
            [不審なリンクを削除しました]();
            ctx.globalAlpha = p.opacity;
            ctx.fillStyle = p.color;
            ctx.font = 'bold 14px sans-serif';
            ctx.fillText(p.text, p.x, p.y);
            ctx.restore();
        });

        // HUD（スコア・ガード数）表示
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 15px monospace';
        ctx.fillText('SCORE: ' + Math.floor(score), 15, 30);

        // ガードストック表示
        let guardStr = 'GUARD: ';
        for (let i = 0; i < MAX_GUARD; i++) {
            guardStr += (i < guardCount) ? '🛡️' : '⚪';
        }
        ctx.textAlign = 'right';
        ctx.fillText(guardStr, canvas.width - 15, 30);
        ctx.textAlign = 'left';
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
